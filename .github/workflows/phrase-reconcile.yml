name: Phrase reconcile

on:
  schedule:
    - cron: '23 6,14 * * 1-5'
  workflow_dispatch:

permissions: {}

jobs:
  reconcile:
    uses: RedHatInsights/i18n-tooling/.github/workflows/phrase-reconcile.yml@e7b063b1c4fec3f45dcc18937df1a1956a9b62f1
    with:
      config-path: i18n/phrase-tms.json
      environment: phrase-pilot
    secrets:
      PHRASE_PLATFORM_API_TOKEN: ${{ secrets.PHRASE_PLATFORM_API_TOKEN }}
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write
