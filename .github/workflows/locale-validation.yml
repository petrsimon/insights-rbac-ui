name: Validate locale catalogs

on:
  pull_request:
    paths:
      - .github/workflows/locale-validation.yml
      - i18n/catalog-validation.json
      - i18n/phrase-tms.json
      - i18n/phrase-tms-feo.json
      - locales/**
      - messages/**
      - deploy/frontend.yaml
      - deploy/locales/**
      - src/Messages.js
      - src/*.js
      - package.json
      - package-lock.json

permissions: {}

jobs:
  validate:
    uses: RedHatInsights/i18n-tooling/.github/workflows/i18n-validate.yml@e7b063b1c4fec3f45dcc18937df1a1956a9b62f1
    with:
      package-manager: npm
      validation-config: i18n/catalog-validation.json
      node-version: '24.15.0'
    permissions:
      contents: read
